<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exam Calendar - Under Development</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    
    <!-- Background subtle gradient effect -->
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-slate-950 -z-10"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
            <a href="https://www.selectionlibrary.com/tools/" class="group inline-flex items-center text-sm font-medium text-slate-400 hover:text-emerald-400 transition-colors duration-200 outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 rounded-md p-1">
                <i class="fa-solid fa-arrow-left mr-2 transition-transform duration-200 group-hover:-translate-x-1"></i>
                Back to Tools
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        
        <!-- Placeholder Card -->
        <div class="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 sm:p-10 max-w-lg w-full text-center shadow-2xl shadow-slate-950/50 relative overflow-hidden">
            
            <!-- Decorative top accent line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>

            <!-- Animated Icon Container -->
            <div class="relative inline-flex items-center justify-center w-28 h-28 mb-8">
                <!-- Glowing backdrop -->
                <div class="absolute inset-0 bg-emerald-500/20 blur-2xl rounded-full animate-pulse"></div>
                
                <!-- Main Icon Box -->
                <div class="relative bg-slate-800/80 border border-slate-600/50 p-6 rounded-2xl shadow-lg backdrop-blur-sm animate-float">
                    <i class="fa-regular fa-calendar-days text-5xl text-emerald-400 drop-shadow-sm"></i>
                    
                    <!-- Spinning Gear Badge -->
                    <div class="absolute -bottom-3 -right-3 bg-slate-900 p-2.5 rounded-full border-2 border-slate-700 shadow-md flex items-center justify-center">
                        <i class="fa-solid fa-gear text-xl text-emerald-500 animate-spin-slow"></i>
                    </div>
                </div>
            </div>

            <!-- Typography -->
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-4 tracking-tight">
                Live Exam Calendar is <br class="hidden sm:block"/> Under Development
            </h1>
            
            <p class="text-slate-400 text-sm sm:text-base mb-8 leading-relaxed max-w-sm mx-auto">
                Our team is currently building a real-time, This page will soon help you seamlessly stay on top of upcoming exams, crucial deadlines, and dynamically changing schedules.
            </p>

            <!-- Action Button -->
            <a href="https://www.selectionlibrary.com/tools/" class="inline-flex items-center justify-center w-full sm:w-auto px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-xl transition-all duration-200 border border-slate-600 hover:border-slate-500 hover:shadow-lg hover:shadow-slate-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-800">
                <i class="fa-solid fa-layer-group mr-2 opacity-80"></i>
                Go Back to Tools
            </a>
            
        </div>
    </main>

</body>
</html>
